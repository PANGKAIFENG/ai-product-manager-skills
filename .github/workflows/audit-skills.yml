name: Audit Skills

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install audit dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Audit catalog and repository structure
        run: python3 scripts/audit_skills.py .

      - name: Validate v0.3 asset catalog
        run: python3 scripts/check_v03_asset_catalog.py .

      - name: Run repository audit regression tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Run PRD regression tests
        run: python3 -m unittest discover -s skills/prd-architect/tests -p "test_*.py" -v

      - name: Run research dashboard regression tests
        run: python3 -m unittest discover -s skills/research-topic-compiler/tests -p "test_*.py" -v

      - name: Run Skill governance regression tests
        run: python3 -m unittest discover -s skills/team-skill-creator/tests -p "test_*.py" -v

      - name: Run UI structure regression tests
        run: python3 -m unittest discover -s skills/ui-mockup-desktop-workbench/tests -p "test_*.py" -v

      - name: Run DingTalk publisher regression tests
        env:
          PRODUCT_DELIVERY_VALIDATOR: ${{ github.workspace }}/skills/prd-architect/scripts/validate_product_delivery_manifest.py
        run: python3 -m unittest discover -s tools/publishers/dingtalk-prd-publisher/runtime-adapter/scripts -p "test_*.py" -v

      - name: Run Yunxiao publisher regression tests
        run: python3 -m unittest discover -s tools/publishers/yunxiao-work-item-publisher/runtime-adapter/scripts -p "test_*.py" -v
